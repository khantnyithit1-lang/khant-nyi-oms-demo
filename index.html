<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khant Nyi Thit — Order Fulfillment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f1f3f5;
    --border: #e2e5ea;
    --text: #111827;
    --muted: #6b7280;
    --accent: #0f766e;
    --accent-soft: rgba(15, 118, 110, 0.10);
    --accent-ink: #ffffff;
    --radius: 8px;
  }
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --surface: #161920;
    --surface-2: #1e222b;
    --border: #2a2f3a;
    --text: #f3f4f6;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Noto Sans Myanmar', system-ui, -apple-system, sans-serif;
    font-size: 13.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  html[lang="my"] body {
    font-family: 'Pyidaungsu', 'Noto Sans Myanmar', 'Padauk', sans-serif;
    line-height: 1.75;
    letter-spacing: 0;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 24px; height: 58px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; }
  .brand-badge {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-weight: 800; font-size: 13px;
  }
  .view-tabs {
    display: inline-flex; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 3px; gap: 2px;
  }
  .view-tabs button {
    border: 0; background: transparent; color: var(--muted);
    padding: 6px 13px; border-radius: 6px; font-size: 12.5px; font-weight: 600;
  }
  .view-tabs button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .ctrl {
    height: 32px; padding: 0 9px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface);
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
  }
  .ctrl select { border: 0; background: transparent; outline: 0; cursor: pointer; }
  .ctrl input[type="color"] { width: 18px; height: 18px; border: 0; padding: 0; background: transparent; cursor: pointer; }
  .btn {
    height: 34px; padding: 0 13px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.danger { color: #dc2626; border-color: rgba(220,38,38,0.35); }
  .btn.sm { height: 28px; padding: 0 9px; font-size: 11.5px; }

  .container { max-width: 1380px; margin: 0 auto; padding: 20px 24px 48px; }
  .summary-strip {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 18px; overflow: hidden;
  }
  .summary-cell { padding: 14px 18px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
  .summary-cell:last-child { border-right: 0; }
  .summary-cell span { font-size: 11.5px; color: var(--muted); font-weight: 500; }
  .summary-cell strong { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; }
  .input {
    height: 34px; padding: 0 11px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface); outline: 0; font-size: 13px;
  }
  .input:focus { border-color: var(--accent); }
  .search-box { min-width: 240px; flex: 1; max-width: 340px; }
  .pill-filters { display: flex; gap: 4px; flex-wrap: wrap; }
  .pill-filters button {
    height: 30px; padding: 0 11px; border-radius: 99px;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 500;
  }
  .pill-filters button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  .bulk-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: var(--accent-soft); border: 1px solid var(--accent);
    border-radius: var(--radius); padding: 8px 14px; margin-bottom: 12px;
  }

  .board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px; align-items: start; }
  .col { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
  .col-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  html[lang="my"] .col-head { text-transform: none; letter-spacing: 0; }
  .col-count { background: var(--surface); border: 1px solid var(--border); padding: 1px 7px; border-radius: 99px; font-size: 11px; color: var(--text); }
  .col-cards { display: grid; gap: 9px; }
  .order-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
    padding: 12px; display: grid; gap: 7px; cursor: pointer; transition: border-color .15s, transform .15s;
  }
  .order-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card-title { font-weight: 600; font-size: 13.5px; }
  .card-sub { font-size: 12px; color: var(--muted); }
  .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .phone-link { color: var(--accent); text-decoration: none; font-weight: 500; font-size: 12px; }
  .phone-link:hover { text-decoration: underline; }

  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 920px; }
  th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--border); padding: 10px 12px; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: 0; }

  .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .b-Pending { background: #fef3c7; color: #92400e; }
  .b-Processing { background: #e0f2fe; color: #075985; }
  .b-Shipped { background: #ede9fe; color: #5b21b6; }
  .b-Delivered { background: #dcfce7; color: #166534; }
  .b-Cancelled { background: #fee2e2; color: #991b1b; }
  :root[data-theme="dark"] .b-Pending { background: #452f0c; color: #fcd34d; }
  :root[data-theme="dark"] .b-Processing { background: #0c3547; color: #7dd3fc; }
  :root[data-theme="dark"] .b-Shipped { background: #2e1d52; color: #c4b5fd; }
  :root[data-theme="dark"] .b-Delivered { background: #0f3a24; color: #86efac; }
  :root[data-theme="dark"] .b-Cancelled { background: #471619; color: #fca5a5; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .dash-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 16px; margin-bottom: 14px;
  }
  .dash-presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .dash-presets button {
    height: 30px; padding: 0 11px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600;
  }
  .dash-presets button.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .dash-dates { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .dash-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; margin-bottom: 14px; }
  .dash-chart {
    height: 170px; display: flex; align-items: flex-end; gap: 8px;
    padding: 18px 4px 24px; border-bottom: 1px solid var(--border);
  }
  .dash-col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
  .dash-val { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
  .dash-bar-fill { width: min(34px, 85%); border-radius: 4px 4px 0 0; background: var(--accent); min-height: 3px; transition: height .2s; }
  .dash-lbl { font-size: 10px; color: var(--muted); position: absolute; bottom: -20px; white-space: nowrap; }
  .prog-row { display: grid; gap: 5px; margin-bottom: 11px; font-size: 12.5px; }
  .prog-top { display: flex; justify-content: space-between; }
  .prog-track { height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--accent); border-radius: 99px; }

  .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.38); z-index: 40; display: none; justify-content: flex-end; }
  .drawer-backdrop.open { display: flex; }
  .drawer { width: min(460px, 100%); height: 100%; background: var(--surface); border-left: 1px solid var(--border); padding: 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .kv-list { display: grid; gap: 9px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .kv span:first-child { color: var(--muted); }
  .form-stack { display: grid; gap: 12px; }
  .form-stack label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .item-row { display: grid; grid-template-columns: 1fr 68px 96px 32px; gap: 6px; align-items: center; }

  dialog { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); padding: 22px; width: min(560px, calc(100% - 24px)); box-shadow: 0 20px 50px rgba(0,0,0,0.22); }
  dialog::backdrop { background: rgba(0,0,0,0.45); }
  .toast { position: fixed; bottom: 20px; right: 20px; z-index: 60; background: var(--text); color: var(--bg); padding: 10px 15px; border-radius: 6px; font-size: 12.5px; font-weight: 600; display: none; }
  .hidden { display: none !important; }

  /* Printable Packing Slip */
  #printSlip { display: none; }
  @media print {
    body > *:not(#printSlip) { display: none !important; }
    #printSlip { display: block !important; background: #fff; color: #111; padding: 16px; font-family: 'Inter', 'Noto Sans Myanmar', sans-serif; max-width: 520px; margin: 0 auto; }
    #printSlip table { width: 100%; min-width: 0; border-collapse: collapse; margin: 12px 0; }
    #printSlip th, #printSlip td { border: 1px solid #ccc; padding: 7px 9px; font-size: 12px; background: #fff; color: #111; }
  }

  @media (max-width: 1024px) {
    .board { grid-template-columns: repeat(2, 1fr); }
    .dash-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .topbar { height: auto; padding: 12px 16px; flex-wrap: wrap; }
    .summary-strip { grid-template-columns: repeat(2, 1fr); }
    .summary-cell { border-bottom: 1px solid var(--border); }
    .board { grid-template-columns: 1fr; }
    .container { padding: 14px 14px 40px; }
    .item-row { grid-template-columns: 1fr 60px 80px 30px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-badge">K</div>
    <span id="appTitle">Order Fulfillment</span>
  </div>
  <nav class="view-tabs" aria-label="Workspace views">
    <button type="button" class="active" data-view="board" id="tabBoard">Board</button>
    <button type="button" data-view="list" id="tabList">Orders</button>
    <button type="button" data-view="dashboard" id="tabDashboard">Dashboard</button>
  </nav>
  <div class="top-actions">
    <label class="ctrl" title="Brand Color"><span>🎨</span><input type="color" id="colorPicker" value="#0f766e" aria-label="Brand color"></label>
    <label class="ctrl"><select id="langSelect" aria-label="Language"><option value="en">EN</option><option value="my">မြန်မာ</option></select></label>
    <button type="button" class="ctrl" id="themeBtn" aria-label="Toggle theme">☾</button>
    <button type="button" class="btn primary" id="newOrderBtn">+ New Order</button>
  </div>
</header>

<main class="container">
  <section class="summary-strip" id="globalSummary" aria-label="Order metrics">
    <div class="summary-cell"><span id="lblTotal">Total Orders</span><strong id="mTotal">0</strong></div>
    <div class="summary-cell"><span id="lblOpen">In Progress</span><strong id="mOpen">0</strong></div>
    <div class="summary-cell"><span id="lblDone">Delivered</span><strong id="mDelivered">0</strong></div>
    <div class="summary-cell"><span id="lblRev">Delivered Revenue</span><strong id="mRevenue">0 MMK</strong></div>
  </section>

  <section class="toolbar">
    <div class="toolbar-left">
      <input type="search" class="input search-box" id="searchInput" placeholder="Search order ID, customer, phone, address...">
      <div class="pill-filters" id="statusPills"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn" id="exportCsvBtn">Export CSV</button>
      <button type="button" class="btn danger" id="resetBtn">Reset</button>
    </div>
  </section>

  <div class="bulk-bar hidden" id="bulkBar">
    <strong id="bulkCount" style="font-size:12.5px">0 selected</strong>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select class="input" id="bulkStatus" style="height:30px">
        <option>Pending</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option>
      </select>
      <button type="button" class="btn sm primary" id="bulkApply">Apply Status</button>
      <button type="button" class="btn sm" id="bulkClear">Clear</button>
    </div>
  </div>

  <section id="viewBoard" class="board"></section>

  <section id="viewList" class="table-card hidden">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:34px"><input type="checkbox" id="selectAllChk" aria-label="Select all orders"></th>
            <th id="thId">Order ID</th><th id="thDate">Date</th><th id="thCust">Customer</th><th id="thPhone">Phone</th><th id="thAddr">Address / Courier</th><th id="thItems">Items</th><th id="thTotal">Total</th><th id="thStatus">Status</th><th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>

  <section id="viewDashboard" class="hidden">
    <div class="dash-bar">
      <div class="dash-presets" id="dashPresets">
        <button type="button" data-range="today" id="rngToday">Today</button>
        <button type="button" data-range="7" id="rng7">Last 7 Days</button>
        <button type="button" data-range="month" class="active" id="rngMonth">This Month</button>
        <button type="button" data-range="all" id="rngAll">All Time</button>
      </div>
      <div class="dash-dates">
        <label style="display:inline-flex;align-items:center;gap:6px"><span id="lblDashFrom">From</span> <input type="date" class="input" id="dashFrom" style="height:30px"></label>
        <label style="display:inline-flex;align-items:center;gap:6px"><span id="lblDashTo">To</span> <input type="date" class="input" id="dashTo" style="height:30px"></label>
      </div>
    </div>

    <div class="summary-strip" id="dashMetrics" style="margin-bottom:14px"></div>

    <div class="dash-grid">
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <strong id="dashTrendTitle">Daily Revenue (MMK)</strong>
          <span class="card-sub" id="dashRangeText"></span>
        </div>
        <div class="dash-chart" id="dashChart"></div>
      </div>
      <div class="panel">
        <strong id="dashBreakTitle" style="display:block;margin-bottom:12px">Status &amp; Top Couriers</strong>
        <div id="dashBreakdown"></div>
      </div>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <strong id="dashListTitle">Orders in Selected Range</strong>
        <span class="card-sub" id="dashListCount"></span>
      </div>
      <div id="dashOrdersList" class="kv-list"></div>
    </div>
  </section>
</main>

<!-- Slide-over Order Detail Drawer -->
<div class="drawer-backdrop" id="drawerBackdrop">
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Order details">
    <div class="drawer-head">
      <strong class="mono" id="dOrderId">ORD-1001</strong>
      <div style="display:flex;gap:6px">
        <button type="button" class="btn sm" id="dPrintBtn">Print Slip</button>
        <button type="button" class="btn sm" id="drawerClose">Close</button>
      </div>
    </div>
    <div class="kv-list" id="drawerDetails"></div>
    <div class="form-stack">
      <label><span id="lblDStatus">Order Status</span>
        <select class="input" id="dStatus">
          <option>Pending</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option>
        </select>
      </label>
      <div class="form-row">
        <label><span id="lblDPay">Payment</span>
          <select class="input" id="dPayment">
            <option>Unpaid</option><option>COD</option><option>Partial</option><option>Paid</option>
          </select>
        </label>
        <label><span id="lblDTrack">Tracking #</span>
          <input class="input" id="dTracking" placeholder="TRK-001">
        </label>
      </div>
      <div style="display:flex;gap:8px;margin-top:6px">
        <button type="button" class="btn primary" id="dSaveBtn" style="flex:1">Save Changes</button>
        <button type="button" class="btn" id="dEditBtn">Edit</button>
        <button type="button" class="btn danger" id="dDeleteBtn">Delete</button>
      </div>
    </div>
  </aside>
</div>

<!-- Multi-item New / Edit Order Modal -->
<dialog id="orderModal">
  <form id="orderForm" class="form-stack">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <strong id="modalTitle" style="font-size:16px">New Order</strong>
      <button type="button" class="btn sm" id="modalClose">✕</button>
    </div>
    <div class="form-row">
      <label><span id="lblMCust">Customer Name</span> <input class="input" name="customer" required maxlength="80" placeholder="e.g. May Thiri"></label>
      <label><span id="lblMPhone">Phone</span> <input class="input" name="phone" maxlength="24" placeholder="09xxxxxxxxx"></label>
    </div>
    <div class="form-row">
      <label><span id="lblMAddr">Address / Township</span> <input class="input" name="address" maxlength="120" placeholder="e.g. Sanchaung, Yangon"></label>
      <label><span id="lblMCourier">Courier</span>
        <select class="input" name="courier">
          <option>Royal Express</option><option>Ninja Van</option><option>Own Rider</option><option>Self Pickup</option>
        </select>
      </label>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:12px;color:var(--muted);font-weight:500" id="lblMItems">Order Items</span>
        <button type="button" class="btn sm" id="addItemRowBtn">+ Add Item</button>
      </div>
      <div id="orderItemsWrap" style="display:grid;gap:7px"></div>
    </div>
    <div class="form-row">
      <label><span id="lblMDeliv">Delivery Fee (MMK)</span> <input class="input" name="deliveryFee" id="mDeliveryFee" type="number" min="0" step="500" value="2500"></label>
      <label><span id="lblMStatus">Status</span> <select class="input" name="status"><option>Pending</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select></label>
    </div>
    <div class="form-row" style="align-items:end">
      <label><span id="lblMDate">Order Date</span> <input class="input" name="date" type="date" required></label>
      <div style="text-align:right;padding-bottom:6px">
        <span style="font-size:11.5px;color:var(--muted)" id="lblMTotal">Order Total:</span>
        <strong class="mono" id="mOrderTotal" style="font-size:15px;margin-left:6px">0 MMK</strong>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px">
      <button type="button" class="btn" id="modalCancel">Cancel</button>
      <button type="submit" class="btn primary" id="modalSaveBtn">Save Order</button>
    </div>
  </form>
</dialog>

<dialog id="confirmModal" style="max-width:380px">
  <strong id="cTitle" style="font-size:15px">Confirm</strong>
  <p id="cMsg" style="color:var(--muted);font-size:13px;margin:8px 0 18px"></p>
  <div style="display:flex;justify-content:flex-end;gap:8px">
    <button type="button" class="btn" id="cCancel">Cancel</button>
    <button type="button" class="btn danger" id="cOk">Confirm</button>
  </div>
</dialog>

<div id="printSlip"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const KEY = 'knt_oms_portfolio_v3';
  const META_KEY = 'knt_oms_meta_v2';
  const PRODUCTS = [
    ['Coca-Cola 330ml', 1500], ['Pepsi 330ml', 1500], ['Lay’s Potato Chips', 2500],
    ['Oreo Cookies', 2400], ['Nescafé Coffee', 1800], ['Instant Noodles', 1200],
    ['Shampoo 200ml', 6500], ['Toothpaste 100g', 3200], ['Cooking Oil 1L', 8500],
    ['Rice 1kg', 4000], ['Bottled Water 1L', 700], ['Eggs 10-pack', 5500]
  ];
  const STATUSES = ['Pending', 'Processing', 'Shipped', 'Delivered', 'Cancelled'];
  const NEXT_STAGE = { Pending: 'Processing', Processing: 'Shipped', Shipped: 'Delivered' };
  const daysAgo = (d) => {
    const n = new Date();
    const dt = new Date(n.getFullYear(), n.getMonth(), n.getDate() - d);
    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  };
  const seed = () => {
    const names = ['Aung Min','May Thiri','Kyaw Zin','Su Myat','Htet Naing','Ei Mon','Thura Tun','Nandar Moe','Min Khant','Zin Mar','Ko Ko','Hnin Wai'];
    const addrs = [['Sanchaung, Yangon','Royal Express',2500],['Bahan, Yangon','Own Rider',2000],['Hlaing, Yangon','Royal Express',2500],['Yankin, Yangon','Own Rider',2000],['Chanayethazan, Mandalay','Ninja Van',3500],['Tamwe, Yangon','Self Pickup',0],['Mayangone, Yangon','Royal Express',2500],['Pyin Oo Lwin','Ninja Van',4000]];
    const offsets = [0,0,1,2,3,5,7,10,14,18,24,31,38,46,54,62,70,79,88,96,105,114,123,132,141,150,159,168,177,186,195,204,213,222,231,240,249,258,267,276,285,294,303,312,321,330,339,348,356,362];
    return offsets.map((d, i) => {
      const cust = names[i % names.length];
      const [address, courier, deliveryFee] = addrs[i % addrs.length];
      const p1 = PRODUCTS[i % PRODUCTS.length];
      const p2 = PRODUCTS[(i + 3) % PRODUCTS.length];
      const items = [{ product: p1[0], qty: (i % 4) + 1, price: p1[1] }];
      if (i % 2 === 0) items.push({ product: p2[0], qty: (i % 3) + 1, price: p2[1] });
      let status = 'Delivered';
      if (d === 0) status = i === 0 ? 'Pending' : 'Processing';
      else if (d <= 2) status = i % 2 === 0 ? 'Shipped' : 'Processing';
      else if (d <= 5) status = 'Pending';
      else if (i % 9 === 0) status = 'Cancelled';
      return {
        id: 'ORD-' + (1001 + i),
        date: daysAgo(d),
        customer: cust,
        phone: '0978' + String(1122000 + i * 37),
        address, courier, deliveryFee, items, status
      };
    });
  };

  const $ = (id) => document.getElementById(id);
  const money = (n) => Math.round(n || 0).toLocaleString('en-US') + ' MMK';
  const esc = (s = '') => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function normOrder(o) {
    const items = Array.isArray(o.items) && o.items.length
      ? o.items
      : [{ product: o.product || PRODUCTS[0][0], qty: Number(o.qty) || 1, price: Number(o.price) || 1500 }];
    const deliveryFee = Number(o.deliveryFee) || 0;
    const itemsTotal = items.reduce((s, i) => s + (Number(i.qty) || 0) * (Number(i.price) || 0), 0);
    return { ...o, items, deliveryFee, total: itemsTotal + deliveryFee };
  }

  let orders = (() => {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (Array.isArray(d) && d.length) return d.map(normOrder);
    } catch {}
    return seed().map(normOrder);
  })();
  let meta = (() => {
    try { return JSON.parse(localStorage.getItem(META_KEY) || '{}') || {}; } catch { return {}; }
  })();
  let activeView = 'board', activeStatus = 'All', editingId = null, drawerId = null;
  let dashRange = 'month';
  let selectedIds = new Set();

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(orders));
      localStorage.setItem(META_KEY, JSON.stringify(meta));
    } catch {}
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.style.display = 'none'; }, 2400);
  }

  function confirmBox(title, msg, onYes) {
    $('cTitle').textContent = title; $('cMsg').textContent = msg;
    $('cCancel').onclick = () => $('confirmModal').close();
    $('cOk').onclick = () => { $('confirmModal').close(); onYes(); };
    $('confirmModal').showModal();
  }

  function getFiltered() {
    const q = $('searchInput').value.trim().toLowerCase();
    return orders.map(normOrder).filter(o =>
      (activeStatus === 'All' || o.status === activeStatus) &&
      (!q || [o.id, o.customer, o.phone, o.address, o.courier, ...o.items.map(i => i.product)].join(' ').toLowerCase().includes(q))
    ).sort((a, b) => b.id.localeCompare(a.id));
  }

  function renderMetrics() {
    const list = orders.map(normOrder);
    $('mTotal').textContent = list.length;
    $('mOpen').textContent = list.filter(o => o.status === 'Pending' || o.status === 'Processing' || o.status === 'Shipped').length;
    $('mDelivered').textContent = list.filter(o => o.status === 'Delivered').length;
    const rev = list.filter(o => o.status === 'Delivered').reduce((s, o) => s + o.total, 0);
    $('mRevenue').textContent = money(rev);
  }

  function renderPills() {
    const items = ['All', ...STATUSES];
    $('statusPills').innerHTML = items.map(st =>
      `<button type="button" class="${activeStatus === st ? 'active' : ''}" data-pill="${st}">${st}</button>`
    ).join('');
  }

  function itemsSummary(o) {
    if (o.items.length === 1) return `${o.items[0].product} × ${o.items[0].qty}`;
    return `${o.items[0].product} × ${o.items[0].qty} (+${o.items.length - 1} more)`;
  }

  function renderBoard(list) {
    const cols = ['Pending', 'Processing', 'Shipped', 'Delivered'];
    $('viewBoard').innerHTML = cols.map(st => {
      const items = list.filter(o => o.status === st);
      return `
        <div class="col">
          <div class="col-head"><span>${st}</span><span class="col-count">${items.length}</span></div>
          <div class="col-cards">
            ${items.map(o => `
              <article class="order-card" data-open="${esc(o.id)}">
                <div class="card-top">
                  <span class="mono" style="color:var(--muted)">${esc(o.id)}</span>
                  <span class="mono" style="font-weight:600">${money(o.total)}</span>
                </div>
                <div>
                  <div class="card-title">${esc(o.customer)}</div>
                  <div class="card-sub">${esc(itemsSummary(o))}</div>
                  ${o.address ? `<div class="card-sub" style="margin-top:2px">${esc(o.address)} · ${esc(o.courier || '')}</div>` : ''}
                </div>
                <div class="card-foot">
                  ${o.phone ? `<a class="phone-link mono" href="tel:${esc(o.phone)}" onclick="event.stopPropagation()">${esc(o.phone)}</a>` : `<span class="card-sub">—</span>`}
                  ${NEXT_STAGE[st] ? `<button type="button" class="btn sm" data-advance="${esc(o.id)}">${NEXT_STAGE[st]} →</button>` : `<span class="card-sub">${esc(o.date)}</span>`}
                </div>
              </article>
            `).join('') || `<div class="card-sub" style="padding:12px 6px">No orders</div>`}
          </div>
        </div>
      `;
    }).join('');
  }

  function updateBulkBar() {
    const n = selectedIds.size;
    $('bulkBar').classList.toggle('hidden', n === 0 || activeView !== 'list');
    $('bulkCount').textContent = `${n} selected`;
  }

  function renderTable(list) {
    $('tableBody').innerHTML = list.map(o => `
      <tr data-open="${esc(o.id)}">
        <td onclick="event.stopPropagation()"><input type="checkbox" class="row-chk" data-chk="${esc(o.id)}" ${selectedIds.has(o.id) ? 'checked' : ''} aria-label="Select ${esc(o.id)}"></td>
        <td class="mono">${esc(o.id)}</td>
        <td>${esc(o.date)}</td>
        <td style="font-weight:600">${esc(o.customer)}</td>
        <td class="mono">${o.phone ? `<a class="phone-link" href="tel:${esc(o.phone)}" onclick="event.stopPropagation()">${esc(o.phone)}</a>` : '—'}</td>
        <td><div>${esc(o.address || '—')}</div><div class="card-sub">${esc(o.courier || '')}</div></td>
        <td>${esc(itemsSummary(o))}</td>
        <td class="mono">${money(o.total)}</td>
        <td><span class="badge b-${esc(o.status)}">${esc(o.status)}</span></td>
        <td><button type="button" class="btn sm" data-open="${esc(o.id)}">Details</button></td>
      </tr>
    `).join('') || `<tr><td colspan="10" style="text-align:center;padding:24px;color:var(--muted)">No matching orders</td></tr>`;
    $('selectAllChk').checked = list.length > 0 && list.every(o => selectedIds.has(o.id));
    updateBulkBar();
  }

  function setDashDates(range) {
    dashRange = range;
    const today = daysAgo(0);
    if (range === 'today') { $('dashFrom').value = today; $('dashTo').value = today; }
    else if (range === '7') { $('dashFrom').value = daysAgo(6); $('dashTo').value = today; }
    else if (range === 'month') {
      const n = new Date();
      $('dashFrom').value = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-01`;
      $('dashTo').value = today;
    } else if (range === 'all') { $('dashFrom').value = ''; $('dashTo').value = ''; }
    document.querySelectorAll('#dashPresets button').forEach(b => b.classList.toggle('active', b.dataset.range === range));
    renderDashboard();
  }

  function renderDashboard() {
    const from = $('dashFrom').value;
    const to = $('dashTo').value;
    const list = getFiltered().filter(o => (!from || o.date >= from) && (!to || o.date <= to))
      .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

    const deliv = list.filter(o => o.status === 'Delivered');
    const rev = (activeStatus === 'All' || activeStatus === 'Delivered' ? deliv : list).reduce((s, o) => s + o.total, 0);
    const rate = list.length ? Math.round((deliv.length / list.length) * 100) : 0;
    const avg = deliv.length ? Math.round(rev / deliv.length) : 0;

    const isMy = document.documentElement.lang === 'my';
    $('dashMetrics').innerHTML = `
      <div class="summary-cell"><span>${isMy ? 'ရွေးချယ်ထားသည့် အော်ဒါ' : 'Period Orders'}</span><strong>${list.length}</strong></div>
      <div class="summary-cell"><span>${isMy ? 'ပို့ဆောင်ပြီး' : 'Delivered'}</span><strong>${deliv.length} (${rate}%)</strong></div>
      <div class="summary-cell"><span>${isMy ? 'ပျမ်းမျှအော်ဒါတန်ဖိုး' : 'Avg Order Value'}</span><strong>${money(avg)}</strong></div>
      <div class="summary-cell"><span>${activeStatus === 'All' || activeStatus === 'Delivered' ? (isMy ? 'ပို့ဆောင်ပြီး ဝင်ငွေ' : 'Delivered Revenue') : (isMy ? activeStatus + ' တန်ဖိုး' : activeStatus + ' Value')}</span><strong>${money(rev)}</strong></div>
    `;
    $('dashRangeText').textContent = (from || to) ? `${from || 'Start'} → ${to || 'Now'}` : (isMy ? 'မှတ်တမ်းအားလုံး' : 'All records');

    // Group by Month when range spans > 31 days (e.g. 1-year All Time), otherwise by Day
    const uniqueDates = [...new Set(list.map(o => o.date))].sort();
    const spanDays = uniqueDates.length > 1 ? (new Date(uniqueDates[uniqueDates.length - 1]) - new Date(uniqueDates[0])) / 86400000 : 0;
    const byMonth = spanDays > 35;
    const bucketMap = {};
    list.forEach(o => {
      const key = byMonth ? o.date.slice(0, 7) : o.date;
      if (!bucketMap[key]) bucketMap[key] = 0;
      if (o.status !== 'Cancelled' || activeStatus === 'Cancelled') bucketMap[key] += o.total;
    });
    const keys = Object.keys(bucketMap).sort().slice(-12);
    const maxVal = Math.max(...keys.map(k => bucketMap[k]), 1);
    $('dashTrendTitle').textContent = byMonth
      ? (isMy ? 'လစဉ်ဝင်ငွေ (MMK)' : 'Monthly Revenue (MMK)')
      : (isMy ? 'နေ့စဉ်ဝင်ငွေ (MMK)' : 'Daily Revenue (MMK)');
    $('dashChart').innerHTML = keys.length ? keys.map(k => `
      <div class="dash-col" title="${k}: ${money(bucketMap[k])}">
        <span class="dash-val">${bucketMap[k] >= 1000 ? Math.round(bucketMap[k]/1000) + 'k' : bucketMap[k]}</span>
        <div class="dash-bar-fill" style="height:${Math.max(4, Math.round((bucketMap[k] / maxVal) * 120))}px"></div>
        <span class="dash-lbl">${byMonth ? k.slice(2) : k.slice(5)}</span>
      </div>
    `).join('') : `<p class="card-sub" style="margin:auto">${isMy ? 'ရွေးချယ်ထားသောရက်အတွင်း အော်ဒါမရှိပါ' : 'No orders in this date range'}</p>`;

    // Status & Courier breakdown
    const stCounts = {};
    STATUSES.forEach(st => { stCounts[st] = list.filter(o => o.status === st).length; });
    const maxSt = Math.max(...Object.values(stCounts), 1);
    $('dashBreakdown').innerHTML = STATUSES.filter(st => stCounts[st] > 0).map(st => `
      <div class="prog-row">
        <div class="prog-top"><span>${esc(st)}</span><strong class="mono">${stCounts[st]}</strong></div>
        <div class="prog-track"><div class="prog-fill" style="width:${Math.round((stCounts[st] / maxSt) * 100)}%"></div></div>
      </div>
    `).join('') || `<p class="card-sub">${isMy ? 'အချက်အလက်မရှိပါ' : 'No status data'}</p>`;

    $('dashListCount').textContent = `${list.length} ${isMy ? 'ခု' : 'orders'}`;
    $('dashOrdersList').innerHTML = list.map(o => `
      <div class="kv" style="cursor:pointer" data-open="${esc(o.id)}">
        <div><strong>${esc(o.id)} · ${esc(o.customer)}</strong><div class="card-sub">${esc(o.date)} · ${esc(o.address || '')} · ${esc(itemsSummary(o))}</div></div>
        <div style="text-align:right"><div class="mono">${money(o.total)}</div><span class="badge b-${esc(o.status)}">${esc(o.status)}</span></div>
      </div>
    `).join('') || `<p class="card-sub">${isMy ? 'ရွေးချယ်ထားသောရက်အတွင်း အော်ဒါမရှိပါ' : 'No orders for this date range.'}</p>`;
  }

  function renderAll() {
    renderMetrics();
    renderPills();
    const list = getFiltered();
    renderBoard(list);
    renderTable(list);
    renderDashboard();
  }

  function switchView(v) {
    activeView = v;
    document.querySelectorAll('.view-tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
    $('viewBoard').classList.toggle('hidden', v !== 'board');
    $('viewList').classList.toggle('hidden', v !== 'list');
    $('viewDashboard').classList.toggle('hidden', v !== 'dashboard');
    $('globalSummary').classList.toggle('hidden', v === 'dashboard');
    updateBulkBar();
  }

  function openDrawer(id) {
    const raw = orders.find(x => x.id === id);
    if (!raw) return;
    const o = normOrder(raw);
    drawerId = id;
    const m = meta[id] || {};
    $('dOrderId').textContent = o.id;
    $('drawerDetails').innerHTML = `
      <div class="kv"><span>Date</span><span>${esc(o.date)}</span></div>
      <div class="kv"><span>Customer</span><strong>${esc(o.customer)}</strong></div>
      <div class="kv"><span>Phone</span><span>${o.phone ? `<a class="phone-link mono" href="tel:${esc(o.phone)}">${esc(o.phone)}</a>` : '—'}</span></div>
      <div class="kv"><span>Address</span><span>${esc(o.address || '—')}</span></div>
      <div class="kv"><span>Courier</span><span>${esc(o.courier || '—')}</span></div>
      <div class="kv" style="flex-direction:column;gap:4px">
        <span>Items</span>
        ${o.items.map(i => `<div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${esc(i.product)} × ${i.qty}</span><span class="mono">${money(i.qty * i.price)}</span></div>`).join('')}
      </div>
      <div class="kv"><span>Delivery Fee</span><span class="mono">${money(o.deliveryFee)}</span></div>
      <div class="kv"><span>Total</span><strong class="mono">${money(o.total)}</strong></div>
    `;
    $('dStatus').value = o.status;
    $('dPayment').value = m.payment || 'COD';
    $('dTracking').value = m.tracking || '';
    $('drawerBackdrop').classList.add('open');
  }

  // Multi-item Order Modal helpers
  function addItemRow(productName = PRODUCTS[0][0], qty = 1, price = PRODUCTS[0][1]) {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <select class="input item-prod">${PRODUCTS.map(([n]) => `<option value="${esc(n)}" ${n === productName ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <input class="input item-qty" type="number" min="1" max="999" value="${qty}">
      <input class="input item-price" type="number" min="1" value="${price}">
      <button type="button" class="btn sm danger item-del" title="Remove">×</button>
    `;
    row.querySelector('.item-prod').addEventListener('change', e => {
      const found = PRODUCTS.find(x => x[0] === e.target.value);
      if (found) row.querySelector('.item-price').value = found[1];
      updateModalTotal();
    });
    row.querySelector('.item-qty').addEventListener('input', updateModalTotal);
    row.querySelector('.item-price').addEventListener('input', updateModalTotal);
    row.querySelector('.item-del').addEventListener('click', () => {
      if ($('orderItemsWrap').children.length > 1) { row.remove(); updateModalTotal(); }
    });
    $('orderItemsWrap').append(row);
    updateModalTotal();
  }

  function updateModalTotal() {
    let sum = 0;
    $('orderItemsWrap').querySelectorAll('.item-row').forEach(r => {
      sum += (Number(r.querySelector('.item-qty').value) || 0) * (Number(r.querySelector('.item-price').value) || 0);
    });
    sum += Number($('mDeliveryFee').value) || 0;
    $('mOrderTotal').textContent = money(sum);
  }

  function openOrderModal(id = null) {
    editingId = id;
    const f = $('orderForm');
    f.reset();
    $('orderItemsWrap').replaceChildren();
    const raw = orders.find(x => x.id === id);
    const o = raw ? normOrder(raw) : null;
    $('modalTitle').textContent = o ? `Edit ${o.id}` : (document.documentElement.lang === 'my' ? 'အော်ဒါအသစ်' : 'New Order');
    f.elements.date.value = o?.date || daysAgo(0);
    if (o) {
      f.elements.customer.value = o.customer;
      f.elements.phone.value = o.phone || '';
      f.elements.address.value = o.address || '';
      f.elements.courier.value = o.courier || 'Royal Express';
      f.elements.deliveryFee.value = o.deliveryFee || 0;
      f.elements.status.value = o.status;
      o.items.forEach(i => addItemRow(i.product, i.qty, i.price));
    } else {
      addItemRow();
    }
    updateModalTotal();
    $('orderModal').showModal();
  }

  function printOrderSlip(id) {
    const raw = orders.find(x => x.id === id);
    if (!raw) return;
    const o = normOrder(raw);
    const m = meta[id] || {};
    $('printSlip').innerHTML = `
      <div style="border:1px solid #333;padding:18px">
        <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111;padding-bottom:10px">
          <div><strong style="font-size:16px">KHANT NYI THIT</strong><div style="font-size:11px">PACKING SLIP / WAYBILL</div></div>
          <div style="text-align:right"><strong class="mono">${esc(o.id)}</strong><div style="font-size:11px">${esc(o.date)}</div></div>
        </div>
        <div style="margin:12px 0;font-size:12.5px;line-height:1.6">
          <div><strong>To:</strong> ${esc(o.customer)} (${esc(o.phone || '—')})</div>
          <div><strong>Address:</strong> ${esc(o.address || '—')}</div>
          <div><strong>Courier:</strong> ${esc(o.courier || '—')} · <strong>Tracking:</strong> ${esc(m.tracking || '—')} · <strong>Payment:</strong> ${esc(m.payment || 'COD')}</div>
        </div>
        <table>
          <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr></thead>
          <tbody>
            ${o.items.map(i => `<tr><td>${esc(i.product)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty * i.price)}</td></tr>`).join('')}
            <tr><td colspan="3">Delivery Fee</td><td>${money(o.deliveryFee)}</td></tr>
            <tr><td colspan="3"><strong>TOTAL</strong></td><td><strong>${money(o.total)}</strong></td></tr>
          </tbody>
        </table>
      </div>
    `;
    window.print();
  }

  // Event listeners
  document.querySelectorAll('.view-tabs button').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
  $('statusPills').addEventListener('click', e => {
    const b = e.target.closest('[data-pill]');
    if (b) { activeStatus = b.dataset.pill; renderAll(); }
  });
  $('searchInput').addEventListener('input', renderAll);
  $('addItemRowBtn').onclick = () => addItemRow();
  $('mDeliveryFee').addEventListener('input', updateModalTotal);

  $('selectAllChk').addEventListener('change', e => {
    const list = getFiltered();
    if (e.target.checked) list.forEach(o => selectedIds.add(o.id));
    else list.forEach(o => selectedIds.delete(o.id));
    renderTable(list);
  });

  $('tableBody').addEventListener('change', e => {
    const chk = e.target.closest('.row-chk');
    if (!chk) return;
    if (chk.checked) selectedIds.add(chk.dataset.chk);
    else selectedIds.delete(chk.dataset.chk);
    updateBulkBar();
  });

  $('bulkApply').onclick = () => {
    const nextSt = $('bulkStatus').value;
    orders.forEach(o => { if (selectedIds.has(o.id)) o.status = nextSt; });
    const count = selectedIds.size;
    selectedIds.clear();
    save(); renderAll(); toast(`${count} orders → ${nextSt}`);
  };
  $('bulkClear').onclick = () => { selectedIds.clear(); renderTable(getFiltered()); };

  document.addEventListener('click', e => {
    const adv = e.target.closest('[data-advance]');
    if (adv) {
      e.stopPropagation();
      const o = orders.find(x => x.id === adv.dataset.advance);
      if (o && NEXT_STAGE[o.status]) { o.status = NEXT_STAGE[o.status]; save(); renderAll(); toast(`${o.id} → ${o.status}`); }
      return;
    }
    const open = e.target.closest('[data-open]');
    if (open) openDrawer(open.dataset.open);
  });

  $('dashPresets').addEventListener('click', e => {
    const b = e.target.closest('[data-range]');
    if (b) setDashDates(b.dataset.range);
  });
  ['dashFrom', 'dashTo'].forEach(id => $(id).addEventListener('change', () => {
    dashRange = 'custom';
    document.querySelectorAll('#dashPresets button').forEach(b => b.classList.remove('active'));
    renderDashboard();
  }));

  $('drawerClose').onclick = () => $('drawerBackdrop').classList.remove('open');
  $('drawerBackdrop').addEventListener('click', e => { if (e.target === $('drawerBackdrop')) $('drawerBackdrop').classList.remove('open'); });
  $('dPrintBtn').onclick = () => printOrderSlip(drawerId);
  $('dSaveBtn').onclick = () => {
    const o = orders.find(x => x.id === drawerId);
    if (!o) return;
    o.status = $('dStatus').value;
    meta[o.id] = { payment: $('dPayment').value, tracking: $('dTracking').value.trim() };
    save(); renderAll(); $('drawerBackdrop').classList.remove('open'); toast('Order updated');
  };
  $('dEditBtn').onclick = () => { $('drawerBackdrop').classList.remove('open'); openOrderModal(drawerId); };
  $('dDeleteBtn').onclick = () => {
    $('drawerBackdrop').classList.remove('open');
    confirmBox('Delete Order', `Delete ${drawerId}?`, () => {
      orders = orders.filter(x => x.id !== drawerId);
      selectedIds.delete(drawerId);
      save(); renderAll(); toast('Order deleted');
    });
  };

  $('newOrderBtn').onclick = () => openOrderModal(null);
  $('modalClose').onclick = () => $('orderModal').close();
  $('modalCancel').onclick = () => $('orderModal').close();
  $('orderForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.currentTarget.elements;
    const items = [];
    $('orderItemsWrap').querySelectorAll('.item-row').forEach(r => {
      items.push({
        product: r.querySelector('.item-prod').value,
        qty: Math.max(1, Number(r.querySelector('.item-qty').value) || 1),
        price: Math.max(1, Number(r.querySelector('.item-price').value) || 1)
      });
    });
    const data = normOrder({
      id: editingId || ('ORD-' + (Math.max(1000, ...orders.map(x => Number(x.id.replace('ORD-', '')) || 0)) + 1)),
      customer: f.customer.value.trim(),
      phone: f.phone.value.trim(),
      address: f.address.value.trim(),
      courier: f.courier.value,
      deliveryFee: Math.max(0, Number(f.deliveryFee.value) || 0),
      items,
      status: f.status.value,
      date: f.date.value
    });
    if (editingId) {
      const idx = orders.findIndex(x => x.id === editingId);
      if (idx !== -1) orders[idx] = data;
    } else {
      orders.unshift(data);
    }
    save(); renderAll(); $('orderModal').close(); toast('Order saved');
  });

  $('resetBtn').onclick = () => confirmBox('Reset Demo', 'Restore sample orders?', () => {
    orders = seed().map(normOrder); meta = {}; selectedIds.clear(); save(); renderAll(); toast('Sample orders restored');
  });

  $('exportCsvBtn').onclick = () => {
    const head = ['Order ID', 'Date', 'Customer', 'Phone', 'Address', 'Courier', 'Items', 'Delivery MMK', 'Total MMK', 'Status'];
    const escCsv = v => { const s = String(v ?? ''); return /^[=+@\-\t\r]/.test(s) ? `"'${s.replaceAll('"', '""')}"` : `"${s.replaceAll('"', '""')}"`; };
    const csv = '\ufeff' + [head, ...getFiltered().map(o => [o.id, o.date, o.customer, o.phone, o.address || '', o.courier || '', o.items.map(i => `${i.product} x${i.qty}`).join('; '), o.deliveryFee, o.total, o.status])].map(r => r.map(escCsv).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = 'orders-export.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  };

  // Theme, Brand Color & Myanmar/English Localization
  const i18n = {
    en: {
      title: 'Order Fulfillment', board: 'Board', list: 'Orders', dash: 'Dashboard', rngToday: 'Today', rng7: 'Last 7 Days', rngMonth: 'This Month', rngAll: 'All Time', dFrom: 'From', dTo: 'To', trendT: 'Daily Revenue (MMK)', breakT: 'Status Breakdown', listT: 'Orders in Selected Range', newBtn: '+ New Order',
      total: 'Total Orders', open: 'In Progress', done: 'Delivered', rev: 'Delivered Revenue',
      exp: 'Export CSV', rst: 'Reset', dStatus: 'Order Status', dPay: 'Payment', dTrack: 'Tracking #',
      dSave: 'Save Changes', dEdit: 'Edit', dDel: 'Delete', dPrint: 'Print Slip',
      mCust: 'Customer Name', mPhone: 'Phone', mAddr: 'Address / Township', mCourier: 'Courier',
      mItems: 'Order Items', mAddItem: '+ Add Item', mDeliv: 'Delivery Fee (MMK)', mStatus: 'Status',
      mDate: 'Order Date', mTotal: 'Order Total:', mSave: 'Save Order',
      thId: 'Order ID', thDate: 'Date', thCust: 'Customer', thPhone: 'Phone', thAddr: 'Address / Courier', thItems: 'Items', thTotal: 'Total', thStatus: 'Status'
    },
    my: {
      title: 'အော်ဒါစီမံခန့်ခွဲမှု', board: 'Board မြင်ကွင်း', list: 'အော်ဒါစာရင်း', dash: 'Dashboard', rngToday: 'ယနေ့', rng7: '၇ ရက်စာ', rngMonth: 'ယခုလ', rngAll: 'အားလုံး', dFrom: 'မှ', dTo: 'အထိ', trendT: 'နေ့စဉ်ဝင်ငွေ (MMK)', breakT: 'အခြေအနေအလိုက်', listT: 'ရွေးချယ်ထားသည့် အော်ဒါများ', newBtn: '+ အော်ဒါအသစ်',
      total: 'စုစုပေါင်း အော်ဒါ', open: 'လုပ်ဆောင်ဆဲ', done: 'ပို့ဆောင်ပြီး', rev: 'ပို့ဆောင်ပြီး ဝင်ငွေ',
      exp: 'CSV ထုတ်မည်', rst: 'မူလအတိုင်း', dStatus: 'အော်ဒါအခြေအနေ', dPay: 'ငွေပေးချေမှု', dTrack: 'Tracking နံပါတ်',
      dSave: 'သိမ်းမည်', dEdit: 'ပြင်မည်', dDel: 'ဖျက်မည်', dPrint: 'Slip ထုတ်မည်',
      mCust: 'ဝယ်သူအမည်', mPhone: 'ဖုန်းနံပါတ်', mAddr: 'လိပ်စာ / မြို့နယ်', mCourier: 'ပို့ဆောင်သူ',
      mItems: 'မှာယူသည့် ပစ္စည်းများ', mAddItem: '+ ပစ္စည်းထပ်ထည့်', mDeliv: 'ပို့ဆောင်ခ (MMK)', mStatus: 'အခြေအနေ',
      mDate: 'ရက်စွဲ', mTotal: 'စုစုပေါင်း:', mSave: 'အော်ဒါသိမ်းမည်',
      thId: 'အော်ဒါ ID', thDate: 'ရက်စွဲ', thCust: 'ဝယ်သူ', thPhone: 'ဖုန်းနံပါတ်', thAddr: 'လိပ်စာ / ပို့ဆောင်သူ', thItems: 'ပစ္စည်းများ', thTotal: 'စုစုပေါင်း', thStatus: 'အခြေအနေ'
    }
  };
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    $('themeBtn').textContent = t === 'dark' ? '☼' : '☾';
    try { localStorage.setItem('knt_oms_theme2', t); } catch {}
  }
  function setColor(hex) {
    const c = /^#[0-9a-f]{6}$/i.test(hex) ? hex : '#0f766e';
    const r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
    const lum = (0.299*r + 0.587*g + 0.114*b)/255;
    document.documentElement.style.setProperty('--accent', c);
    document.documentElement.style.setProperty('--accent-soft', `rgba(${r},${g},${b},0.12)`);
    document.documentElement.style.setProperty('--accent-ink', lum > 0.6 ? '#111827' : '#ffffff');
    $('colorPicker').value = c;
    try { localStorage.setItem('knt_oms_color2', c); } catch {}
  }
  function setLang(l) {
    document.documentElement.lang = l === 'my' ? 'my' : 'en';
    $('langSelect').value = l;
    const d = i18n[l] || i18n.en;
    [
      ['appTitle',d.title],['tabBoard',d.board],['tabList',d.list],['tabDashboard',d.dash],['rngToday',d.rngToday],['rng7',d.rng7],['rngMonth',d.rngMonth],['rngAll',d.rngAll],['lblDashFrom',d.dFrom],['lblDashTo',d.dTo],['dashTrendTitle',d.trendT],['dashBreakTitle',d.breakT],['dashListTitle',d.listT],['newOrderBtn',d.newBtn],
      ['lblTotal',d.total],['lblOpen',d.open],['lblDone',d.done],['lblRev',d.rev],['exportCsvBtn',d.exp],['resetBtn',d.rst],
      ['lblDStatus',d.dStatus],['lblDPay',d.dPay],['lblDTrack',d.dTrack],['dSaveBtn',d.dSave],['dEditBtn',d.dEdit],['dDeleteBtn',d.dDel],['dPrintBtn',d.dPrint],
      ['lblMCust',d.mCust],['lblMPhone',d.mPhone],['lblMAddr',d.mAddr],['lblMCourier',d.mCourier],['lblMItems',d.mItems],['addItemRowBtn',d.mAddItem],['lblMDeliv',d.mDeliv],['lblMStatus',d.mStatus],['lblMDate',d.mDate],['lblMTotal',d.mTotal],['modalSaveBtn',d.mSave],
      ['thId',d.thId],['thDate',d.thDate],['thCust',d.thCust],['thPhone',d.thPhone],['thAddr',d.thAddr],['thItems',d.thItems],['thTotal',d.thTotal],['thStatus',d.thStatus]
    ].forEach(([id,tx]) => { if ($(id)) $(id).textContent = tx; });
    try { localStorage.setItem('knt_oms_lang2', l); } catch {}
  }
  $('themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  $('colorPicker').oninput = e => setColor(e.target.value);
  $('langSelect').onchange = e => setLang(e.target.value);

  try {
    setTheme(localStorage.getItem('knt_oms_theme2') || 'light');
    setColor(localStorage.getItem('knt_oms_color2') || '#0f766e');
    setLang(localStorage.getItem('knt_oms_lang2') || 'en');
  } catch { setTheme('light'); setColor('#0f766e'); setLang('en'); }
  setDashDates('month');
  renderAll();
})();
</script>
</body>
</html>
